## Stand-in for SteamOS's default keep list, /usr/lib/rauc/atomic-update-keep.conf, read by the mock steamos-update.
## Reconstructed from a summary of the list on a deck, not copied from it, so the entries match what it
## keeps but not necessarily how it spells them. Notably it doesn't keep /etc/systemd/user, /etc/udev or
## /etc/tmpfiles.d, or timers in /etc/systemd/system. The last block holds the files the container runtime mounts.
## TODO(andywang): replace with a verbatim copy of the deck's list (keeping the container block).

## Users and groups
/etc/passwd
/etc/shadow
/etc/group
/etc/gshadow
/etc/subuid
/etc/subgid

## Machine identity and settings
/etc/hostname
/etc/machine-id
/etc/localtime
/etc/resolv.conf
/etc/environment
/etc/dconf/**

## Network and remote access
/etc/NetworkManager/system-connections/*
/etc/wireguard/*.conf
/etc/ssh/*_key*

## Login screen and updates
/etc/sddm.conf.d/*
/etc/steamos-atomupd/preferences.conf

## System services: units, drop-ins and their enablement links
/etc/systemd/system/*.service
/etc/systemd/system/*.socket
/etc/systemd/system/*.mount
/etc/systemd/system/*.service.d/
/etc/systemd/system/*.socket.d/
/etc/systemd/system/*.mount.d/
/etc/systemd/system/*.wants/
/etc/systemd/system/*.requires/

## Keep lists added in /etc/atomic-update.conf.d
/etc/atomic-update.conf.d/*.conf

## Container runtime (not on a deck)
/etc/hosts
/etc/mtab
