## Stand-in for SteamOS's default keep list, /usr/lib/rauc/atomic-update-keep.conf, read by the mock steamos-update.
## It is not a copy of the real list: it names what steamos/README.md says the real one covers (/etc/systemd/system),
## the keep list directory, the user databases, and the files the container runtime mounts.
## TODO(andywang): confirm against the real list on a deck (cat /usr/lib/rauc/atomic-update-keep.conf), and whether a
## directory entry keeps everything under it, as the mock assumes. Copy the real entries here (keeping the container
## ones below), and drop dotfiles-udev.conf and dotfiles-tmpfiles.conf if the real list already covers those files.
/etc/atomic-update.conf.d
/etc/systemd/system
/etc/passwd
/etc/group
/etc/shadow
/etc/gshadow
/etc/sudoers.d
/etc/hostname
/etc/hosts
/etc/resolv.conf
/etc/mtab
