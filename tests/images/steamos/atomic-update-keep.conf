## Stand-in for SteamOS's default keep list, /usr/lib/rauc/atomic-update-keep.conf, read by the mock steamos-update.
## It is not a copy of the real list: it names what steamos/README.md says the real one covers (/etc/systemd/system),
## the keep list directory, the user databases, and the files the container runtime mounts.
/etc/atomic-update.conf.d
/etc/systemd/system
/etc/passwd
/etc/group
/etc/shadow
/etc/gshadow
/etc/sudoers.d
/etc/hostname
/etc/hosts
/etc/resolv.conf
/etc/mtab
