# Installed by the orei_switch feature of ~/dotfiles/install.sh. Mirrors the laptop panel onto the projector on the X11
# login screen (see /etc/dotfiles/bin/sddm-xsetup). SteamOS keeps /etc/sddm.conf.d across updates.
# SteamOS asks for a Wayland login screen but doesn't ship its compositor (weston), so SDDM fails to start it on
# every boot and falls back to X11 as the sddm user (x11-user). That fallback switches to the session's VT while the
# login screen's X server is still exiting, which once hung for 30s, so SDDM gave up on the session and killed it a
# minute later. Plain X11 stops the login screen first, then switches.
[General]
DisplayServer=x11

[X11]
DisplayCommand=/etc/dotfiles/bin/sddm-xsetup
