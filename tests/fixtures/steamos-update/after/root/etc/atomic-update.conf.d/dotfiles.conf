## Installed to /etc/atomic-update.conf.d/dotfiles.conf by the home_units
## feature of ~/dotfiles/install.sh. SteamOS only keeps /etc files on a keep list
## across updates, and /usr/lib/rauc/atomic-update-keep.conf covers
## /etc/systemd/system but not /etc/systemd/user.
/etc/systemd/user/home-units.service
/etc/systemd/user/default.target.wants/home-units.service
/etc/dotfiles/home-units-start
