# Installed to /etc/systemd/logind.conf.d by the logind feature of ~/dotfiles/install.sh (copied, not linked: logind
# reads it at boot, before an encrypted home is mounted).
#
# Don't suspend when the lid is closed on external power. logind already ignores the lid while docked, but it only
# counts as docked while an external display is in use, and there are moments with none: between the login
# screen's X server quitting and gamescope taking the displays, or after gamescope crashes. A lid closed for the
# whole session then suspends the laptop at those moments, and an eGPU on Thunderbolt doesn't come back from s2idle.
# On battery, closing the lid still suspends.
[Login]
HandleLidSwitchExternalPower=ignore
