# Installed to /etc/systemd/system/tailscaled.service.d by the tailscale feature of ~/dotfiles/install.sh, next to
# tailscaled.service and /etc/default/tailscaled, which are upstream's, unchanged, from the pinned release's systemd/.
# Runs the binaries from /etc/dotfiles/bin instead of /usr/sbin: SteamOS's /usr is read-only and replaced by updates,
# and /opt (on the home partition) may not be mounted yet at boot when the home is encrypted.
[Service]
ExecStart=
ExecStart=/etc/dotfiles/bin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
ExecStopPost=
ExecStopPost=/etc/dotfiles/bin/tailscaled --cleanup
