# Installed to /etc/systemd/system/tailscaled.service.d by the tailscale feature of ~/dotfiles/install.sh, next to
# tailscaled.service and /etc/default/tailscaled, which are upstream's, unchanged, from the pinned release's systemd/.
# Runs the binaries from /opt/tailscale instead of /usr/sbin: SteamOS's /usr is read-only and replaced by updates, while
# /opt is bind-mounted from the home partition (/home/.steamos/offload/opt, outside any user's encrypted home), so it
# waits for that mount.
[Unit]
RequiresMountsFor=/opt/tailscale

[Service]
ExecStart=
ExecStart=/opt/tailscale/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/run/tailscale/tailscaled.sock --port=${PORT} $FLAGS
ExecStopPost=
ExecStopPost=/opt/tailscale/tailscaled --cleanup
