# Installed by the charge_limit feature of ~/dotfiles/install.sh. The kernel's cros_charge_control driver refuses to
# load on Framework laptops, whose EC then enforces the BIOS charge limit, unless given this option; with it, the driver
# adds charge_control_end_threshold to the battery and takes over the EC's limit, which Steam's "Enable battery charge
# limit" setting then sets through steamos-manager (see /opt/dotfiles/steamos-manager/devices/framework-laptop-16.toml).
options cros_charge_control probe_with_fwk_charge_control=1
