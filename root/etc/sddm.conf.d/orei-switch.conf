# Installed by the orei_switch feature of ~/dotfiles/install.sh. Mirrors the laptop panel onto the projector on the X11
# login screen (see /opt/dotfiles/bin/sddm-xsetup), and redoes a switch to the new session's VT that the login
# screen's exit dropped (see /opt/dotfiles/bin/sddm-xstop). SteamOS keeps /etc/sddm.conf.d across updates.
[X11]
DisplayCommand=/opt/dotfiles/bin/sddm-xsetup
DisplayStopCommand=/opt/dotfiles/bin/sddm-xstop
