# Installed by the orei_switch feature of ~/dotfiles/install.sh. Mirrors the laptop panel onto the projector on the X11
# login screen (see /etc/dotfiles/bin/sddm-xsetup), and finishes a switch to the new session's VT that the login
# screen's exit left pending (see /etc/dotfiles/bin/sddm-xstop). SteamOS keeps /etc/sddm.conf.d across updates.
[X11]
DisplayCommand=/etc/dotfiles/bin/sddm-xsetup
DisplayStopCommand=/etc/dotfiles/bin/sddm-xstop
