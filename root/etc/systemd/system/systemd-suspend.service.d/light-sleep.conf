# Installed to /etc/systemd/system/systemd-suspend.service.d by the light_sleep feature of ~/dotfiles/install.sh
# (copied, not linked: systemd may read it while an encrypted home is locked).
#
# Suspend through light-sleep, which runs systemd-sleep as before, unless a live eGPU is on the Framework 16
# expansion bay: that loses its PCIe link in s2idle, so light-sleep then idles with the displays off instead.
[Service]
ExecStart=
ExecStart=/etc/dotfiles/bin/light-sleep suspend
