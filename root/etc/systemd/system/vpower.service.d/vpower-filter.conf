# Installed to /etc/systemd/system/vpower.service.d by the quiet_slow_charger feature of ~/dotfiles/install.sh
# (copied, not linked: systemd reads it at boot, while an encrypted home may be locked).
#
# vpower writes its state files into /run/vpower-raw instead of /run/vpower (a bind mount in its own mount namespace),
# and vpower-filter.service copies them to /run/vpower for Steam, with "Connected slow" changed to "Connected", so
# Steam stops opening its Slow Charger dialog. The rest of vpower.service is left as SteamOS ships it.
[Unit]
Wants=vpower-filter.service

[Service]
RuntimeDirectory=vpower-raw
BindPaths=/run/vpower-raw:/run/vpower
